name: "Build & Test"

on:
  push:
    branches: [ "dev", "main" ]
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '.gitattributes'
      - '.gitignore'
      - '.gitmodules'
      - 'LICENSE'
      - 'README.MD'
  pull_request:
    branches: [ "dev", "main" ]
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '.gitattributes'
      - '.gitignore'
      - '.gitmodules'
      - 'LICENSE'
      - 'README.MD'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Single source of truth for the Go version: the module's go directive.
          go-version-file: go.mod
          check-latest: true

      # This module is a Windows CGO c-archive (main.go is //go:build windows && cgo),
      # so it is cross-compiled with MinGW; there is nothing to build on the native
      # linux target. `make default` runs the real build: a file-scoped
      # `go build -buildmode=c-archive main.go` (full CGO compile of the agent) plus
      # the MinGW DLL link. (`go vet ./...` isn't usable here: it compiles merlin.c in
      # package mode, which #includes the build-generated main.h.)
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y -q mingw-w64 gcc-mingw-w64-i686

      - name: Build (c-archive DLL, amd64)
        run: make default
