name: "Build & Test"

on:
  push:
    branches: [ "dev", "main" ]
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '.gitattributes'
      - '.gitignore'
      - '.gitmodules'
      - 'LICENSE'
      - 'README.MD'
  pull_request:
    branches: [ "dev", "main" ]
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '.gitattributes'
      - '.gitignore'
      - '.gitmodules'
      - 'LICENSE'
      - 'README.MD'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Build inside the same base image merlin-base (merlin-docker) uses, so the
    # MinGW/binutils toolchain matches where the release DLLs are built. Go 1.27
    # (matches go.mod), make, and git are already present.
    #
    # The 386 DLL link used to fail here with
    #   ld: cannot export addMulVVWx / go:buildinfo: symbol not found
    # because mingw's default --export-all-symbols tries to export Go 1.27
    # standard-library symbols the i686 linker won't emit. That is now fixed in
    # the Makefile by exporting an explicit list via merlin.def, so 386 links
    # regardless of the MinGW variant (see merlin.def).
    container: golang:1.27-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # This module is a Windows CGO c-archive (main.go is //go:build windows && cgo),
      # cross-compiled with MinGW; there is nothing to build on the native linux target.
      # Same packages as merlin-docker: the win32-threads x86_64 cross compiler + i686.
      # `make default 386` runs the real builds (file-scoped go build -buildmode=c-archive
      # main.go + the MinGW DLL link) for both architectures. (`go vet ./...` isn't usable
      # here: package-mode vet compiles merlin.c, which #includes the build-generated main.h.)
      - name: Install MinGW
        run: |
          apt-get update
          apt-get install -y -q gcc-mingw-w64-x86-64-win32 gcc-mingw-w64-i686

      - name: Build (c-archive DLL, amd64 + 386)
        run: make default 386
